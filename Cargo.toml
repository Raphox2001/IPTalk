[package]
name = "iptalk"
version = "0.2.2"
edition = "2021"
description = "Sprachverbindung mit minimaler Latenz, direkt von IP zu IP"
license = "MIT"
build = "build.rs"

[[bin]]
name = "iptalk"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
# HTTPS über rustls: keine OpenSSL-Abhängigkeit unter Linux.
if-addrs = "0.15"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
