name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/iptalk.exe
            artifact: IPTalk.exe
            # Alter Name, damit Version 0.2.x das Update noch findet.
            legacy: iptalk-windows-x64.exe
          # Ältere glibc → das Binary läuft auch auf älteren Distributionen.
          - os: ubuntu-22.04
            bin: target/release/iptalk
            artifact: IPTalk-Linux
            legacy: iptalk-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Paket vorbereiten
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
          cp "${{ matrix.bin }}" "dist/${{ matrix.legacy }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Download:** `IPTalk.exe` (Windows) bzw. `IPTalk-Linux` (Linux).
            Die Dateien `iptalk-windows-x64.exe` und `iptalk-linux-x64` sind identisch und dienen nur der automatischen Aktualisierung älterer Versionen.
